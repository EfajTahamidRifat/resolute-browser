name: Chromium build stage
description: >
  One stage of the chained Chromium build. Syncs Chromium, restores the previous
  stage's build output if resuming, builds until shortly before the job time limit,
  then either uploads the APK or saves progress for the next stage.

inputs:
  cpu:
    description: GN target_cpu
    default: arm64
  resume:
    description: "'true' to continue from the previous stage's saved output"
    required: true
  resume_run_id:
    description: "Earlier workflow run to take the saved output from (empty = this run)"
    default: ""

outputs:
  done:
    description: "'true' when the APK is finished"
    value: ${{ steps.build.outputs.done }}

runs:
  using: composite
  steps:
    - name: Free disk space and set paths
      shell: bash
      run: |
        # Stop building ~65 min before the 355-min job limit, leaving time to save state.
        echo "RES_DEADLINE=$(( $(date +%s) + 290 * 60 ))" >> "$GITHUB_ENV"
        df -h /
        # Chromium needs nearly the whole disk. Remove every preinstalled toolchain
        # it doesn't use (Chromium brings its own compiler, JDK and Android SDK).
        sudo docker image prune --all --force > /dev/null 2>&1 || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
          /usr/local/share/powershell /usr/local/julia* /opt/microsoft /opt/az \
          /usr/share/miniconda /usr/local/lib/node_modules /usr/lib/jvm /opt/pipx \
          /usr/local/share/chromium /opt/google /usr/lib/firefox /usr/lib/mono \
          /usr/local/aws-cli /usr/local/aws-sam-cli /usr/lib/google-cloud-sdk \
          /usr/share/az_* /usr/local/share/vcpkg /usr/local/bin/{minikube,kind,helm,pulumi*,terraform,packer,bicep,oc,kubectl,azcopy*} \
          /etc/skel/.rustup /home/runner/.rustup /home/runner/.cargo /usr/local/n \
          /usr/share/gradle* /usr/share/apache-maven* /usr/share/kotlinc /usr/share/sbt \
          /usr/lib/llvm-* /usr/lib/postgresql /usr/lib/heroku /usr/share/doc /usr/share/man \
          /var/lib/docker || true
        sudo apt-get clean
        # Chromium's work folder; on current runners /mnt shares the root disk.
        sudo mkdir -p /mnt/res && sudo chown "$USER" /mnt/res
        echo "RES_ROOT=/mnt/res" >> "$GITHUB_ENV"
        echo "RES_WORK=/mnt/res/work" >> "$GITHUB_ENV"
        echo "RES_PACKAGES=/mnt/res/packages" >> "$GITHUB_ENV"
        df -h / /mnt

    - name: Install depot_tools
      shell: bash
      run: |
        git clone -q --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /mnt/res/depot_tools
        echo "/mnt/res/depot_tools" >> "$GITHUB_PATH"
        echo "DEPOT_TOOLS_UPDATE=0" >> "$GITHUB_ENV"
        /mnt/res/depot_tools/gclient --version

    - name: Install build dependencies
      shell: bash
      run: |
        v=$(cat chromium/VERSION)
        curl -fsSL --retry 5 --retry-all-errors \
          "https://chromium.googlesource.com/chromium/src/+/refs/tags/${v}/build/install-build-deps.py?format=TEXT" \
          | base64 -d > "$RUNNER_TEMP/install-build-deps.py"
        # The Android deps include 32-bit (i386) libraries: enable i386.
        sudo dpkg --add-architecture i386
        # Don't depend on one Ubuntu mirror. Runs of 2026-11-11 failed because
        # the runner could not resolve azure.archive.ubuntu.com or
        # security.ubuntu.com. apt's "mirror+file" method tries these in order.
        printf '%s\n' \
          http://azure.archive.ubuntu.com/ubuntu/ \
          http://archive.ubuntu.com/ubuntu/ \
          https://mirrors.edge.kernel.org/ubuntu/ \
          http://mirror.math.princeton.edu/pub/ubuntu/ \
          | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i -E 's#https?://security\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/apt-mirrors.txt#' \
            /etc/apt/sources.list.d/ubuntu.sources
        fi
        for attempt in 1 2 3; do
          if sudo apt-get update -o Acquire::Retries=5 \
             && sudo python3 "$RUNNER_TEMP/install-build-deps.py" --no-prompt \
                  --no-chromeos-fonts --no-arm --no-nacl --android; then
            exit 0
          fi
          echo "install-build-deps attempt $attempt failed; retrying in 60 s"
          sleep 60
        done
        # A resumed stage has already been through this on earlier machines and
        # mostly needs Chromium's bundled toolchain, so carry on and let the
        # build show if anything is really missing. A fresh build must stop.
        if [ "${{ inputs.resume }}" = "true" ]; then
          echo "::warning::Build dependencies could not be installed; continuing because this stage resumes an earlier build."
          exit 0
        fi
        exit 1

    - name: Sync Chromium
      shell: bash
      run: bash chromium/scripts/sync.sh

    - name: Download previous stage output
      if: inputs.resume == 'true'
      uses: actions/download-artifact@v8
      with:
        name: chromium-state-${{ inputs.cpu }}
        path: /mnt/res/state
        run-id: ${{ inputs.resume_run_id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Restore previous stage output
      if: inputs.resume == 'true'
      shell: bash
      run: |
        mkdir -p "$RES_WORK/src/out"
        tar -C "$RES_WORK/src/out" --zstd -xf /mnt/res/state/state.tar.zst
        rm -rf /mnt/res/state
        df -h /mnt

    - name: Build
      id: build
      shell: bash
      env:
        RES_CPU: ${{ inputs.cpu }}
      run: |
        rc=0
        bash chromium/scripts/build.sh || rc=$?
        df -h /mnt
        case "$rc" in
          0) echo "done=true" >> "$GITHUB_OUTPUT" ;;
          124) echo "done=false" >> "$GITHUB_OUTPUT" ;;
          *) exit "$rc" ;;
        esac

    - name: Upload APK
      if: steps.build.outputs.done == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: resolute-chromium-${{ inputs.cpu }}
        path: |
          /mnt/res/packages/*.apk
          /mnt/res/packages/*.aab
        compression-level: 0
        retention-days: 30

    # Also saved when the build finishes, so a later run with small changes
    # (patches, branding) can start from it with resume_run_id and only
    # rebuild what changed.
    - name: Save progress for next stage
      if: steps.build.outputs.done == 'false' || steps.build.outputs.done == 'true'
      shell: bash
      run: |
        mkdir -p /mnt/res/state
        tar -C "$RES_WORK/src/out" --zstd -cf /mnt/res/state/state.tar.zst "android-${{ inputs.cpu }}"
        ls -lh /mnt/res/state

    - name: Upload progress
      if: steps.build.outputs.done == 'false' || steps.build.outputs.done == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: chromium-state-${{ inputs.cpu }}
        path: /mnt/res/state/state.tar.zst
        compression-level: 0
        retention-days: ${{ steps.build.outputs.done == 'true' && 14 || 2 }}
        overwrite: true
