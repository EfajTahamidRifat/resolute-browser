<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resolute wallet test</title></head>
<body style="font:18px sans-serif;padding:24px">
<h1>Resolute wallet test</h1>
<p id="provider">checking provider...</p>
<button id="go" style="font-size:22px;padding:16px 24px">Connect wallet</button>
<p id="result">not requested</p>
<script>
  // Asks the injected wallet (MetaMask) for accounts, like a dApp's Connect
  // button. The E2E test taps the button and then looks for MetaMask's window.
  const p = document.getElementById('provider');
  const r = document.getElementById('result');
  function check() {
    p.textContent = window.ethereum
      ? 'provider: yes (isMetaMask=' + !!window.ethereum.isMetaMask + ')'
      : 'provider: none';
  }
  setTimeout(check, 1500);
  document.getElementById('go').onclick = async () => {
    check();
    if (!window.ethereum) { r.textContent = 'result: no provider'; return; }
    r.textContent = 'result: waiting for wallet';
    console.log('RESOLUTE_E2E request start');
    try {
      const a = await window.ethereum.request({method: 'eth_requestAccounts'});
      r.textContent = 'result: accounts ' + a.length;
    } catch (e) {
      r.textContent = 'result: error ' + (e && (e.code + ' ' + e.message));
    }
    console.log('RESOLUTE_E2E ' + r.textContent);
  };
</script>
</body></html>
