# Signs a finished arm64 Chromium build's Android App Bundle (.aab) with the
# Google Play upload key, ready to upload in Play Console.
# The key only lives in GitHub secrets (RELEASE_KEYSTORE_BASE64,
# RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS); see docs/MAINTAINING.md section 7.
# The signed .aab is kept as a workflow artifact (not a public release).
# With "track" set, it is also uploaded to that Google Play track (closed test =
# "alpha") through the Play Developer API. GitHub signs in to Google with
# Workload Identity Federation: no key file; Google only accepts workflows from
# this repo's main branch. Never upload to "production" from here until the
# owner decides (see docs/MAINTAINING.md section 7).
# With "screenshots_run" set (an E2E test run made with store_shots), the store
# listing's phone screenshots are replaced by that run's framed screenshots
# (needs the "Manage store presence" permission for the upload account).
# run_id may then be left empty to change only the screenshots.
name: Sign Play release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Chromium APK run ID (arm64) that produced the .aab (empty = screenshots only)"
        required: false
        default: ""
      track:
        description: "Upload to this Play track (alpha = closed test). Empty = sign only."
        required: false
        default: ""
      notes:
        description: "What's new (shown to testers, en-US)"
        required: false
        default: "Improvements and fixes."
      screenshots_run:
        description: "E2E test run ID (made with store_shots) whose framed screenshots replace the Play listing's phone screenshots"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write   # for Workload Identity Federation (Play upload)

env:
  PACKAGE: com.resolute.browser
  WIF_PROVIDER: projects/121199260441/locations/global/workloadIdentityPools/github/providers/resolute-repo
  WIF_SERVICE_ACCOUNT: github-play-upload@project-53290f71-1868-4c1d-a2d.iam.gserviceaccount.com

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the build
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" \
            -n resolute-chromium-arm64 -D build
          ls -l build
          test -f build/resolute-chromium-arm64.aab

      - name: Sign the .aab with the upload key
        if: inputs.run_id != ''
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -eu
          [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] || { echo "RELEASE_* secrets missing"; exit 1; }
          ks="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KS_B64" | base64 -d > "$ks"
          mkdir -p out
          cp build/resolute-chromium-arm64.aab out/resolute-play-arm64.aab
          # Remove the Chromium debug-key signature, then sign with the upload key.
          zip -q -d out/resolute-play-arm64.aab 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          jarsigner -keystore "$ks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            out/resolute-play-arm64.aab "$KS_ALIAS" > /dev/null
          rm -f "$ks"

      - name: Check signature, package and version
        if: inputs.run_id != ''
        run: |
          set -eu
          jarsigner -verify out/resolute-play-arm64.aab | tail -1
          sha=$(keytool -printcert -jarfile out/resolute-play-arm64.aab | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Signer SHA-256: $sha"
          want="85:8F:D5:98:48:C7:CA:ED:31:F5:21:14:CB:DE:F3:4E:BE:EA:D6:77:4A:86:A8:7B:E1:CF:82:52:10:02:18:AE"
          [ "$sha" = "$want" ] || { echo "Not signed with the Resolute upload key"; exit 1; }
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar bundletool.jar dump manifest --bundle out/resolute-play-arm64.aab \
            | grep -o 'package="[^"]*"\|android:versionCode="[^"]*"\|android:versionName="[^"]*"' | tee manifest.txt
          grep -q 'package="com.resolute.browser"' manifest.txt
          sed -n 's/.*android:versionCode="\([0-9]*\)".*/\1/p' manifest.txt > version_code.txt
          # Permissions that Play asks declarations for (see docs/MAINTAINING.md).
          java -jar bundletool.jar dump manifest --bundle out/resolute-play-arm64.aab \
            | grep -o 'android.permission.[A-Z_]*' | sort -u | grep -E 'FOREGROUND|QUERY_ALL|INSTALL_PACKAGES|LOCATION|CONTACTS|SMS|CALL_LOG|ACCESSIBILITY|MANAGE_EXTERNAL' | tee permissions.txt
          # Hardware Play would treat as required (blocks devices without it).
          java -jar bundletool.jar dump manifest --bundle out/resolute-play-arm64.aab \
            | grep -o '<uses-feature[^>]*>' | grep -v 'required="false"' | grep -v glEsVersion | tee required_features.txt || true
          {
            echo "## Resolute Play bundle"
            echo "Built by run ${{ inputs.run_id }}. Signed with the upload key ($sha)."
            echo '```'; cat manifest.txt; ls -l out; echo; echo "Declared-sensitive permissions:"; cat permissions.txt; echo; echo "Required hardware (should be empty):"; cat required_features.txt; echo '```'
            echo "Download the **resolute-play-arm64** artifact below and upload the .aab in Play Console."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the signed bundle
        if: inputs.run_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: resolute-play-arm64
          path: out/resolute-play-arm64.aab
          compression-level: 0
          retention-days: 90

      - name: Refuse production uploads
        if: inputs.track != ''
        run: |
          case "${{ inputs.track }}" in
            production) echo "Production uploads are not allowed from this workflow yet."; exit 1;;
          esac

      - name: Get the store screenshots
        if: inputs.screenshots_run != ''
        env:
          RUN: ${{ inputs.screenshots_run }}
        run: |
          set -eu
          case "$RUN" in *[!0-9]*|'') echo "screenshots_run must be a run ID"; exit 1;; esac
          git clone -q --depth 1 --branch e2e-results --filter=blob:none --sparse \
            "https://github.com/${{ github.repository }}" results
          git -C results sparse-checkout set "runs/$RUN/store/framed"
          mkdir -p shots
          cp results/runs/$RUN/store/framed/*.png shots/
          ls -l shots
          n=$(ls shots/*.png | wc -l)
          [ "$n" -ge 2 ] && [ "$n" -le 8 ] || { echo "Play needs 2 to 8 phone screenshots, found $n"; exit 1; }
          for f in shots/*.png; do
            python3 -c "import struct,sys; d=open(sys.argv[1],'rb').read(24); w,h=struct.unpack('>II',d[16:24]); print(sys.argv[1],w,h); sys.exit(0 if (w,h)==(1080,1920) else 1)" "$f"
          done

      - name: Sign in to Google (no key file)
        if: inputs.track != '' || inputs.screenshots_run != ''
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Google Play
        if: inputs.track != '' && inputs.run_id != ''
        env:
          TOKEN: ${{ steps.gauth.outputs.access_token }}
          TRACK: ${{ inputs.track }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE"
          up="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE"
          auth=(-H "Authorization: Bearer $TOKEN")
          code=$(cat version_code.txt)
          edit=$(curl -sS --fail-with-body "${auth[@]}" -X POST "$api/edits" | jq -r .id)
          echo "Edit $edit, versionCode $code, track $TRACK"
          curl -sS --fail-with-body "${auth[@]}" -X POST \
            -H "Content-Type: application/octet-stream" --data-binary @out/resolute-play-arm64.aab \
            --max-time 1800 "$up/edits/$edit/bundles?uploadType=media" | jq '{versionCode, sha256}'
          body=$(jq -n --arg t "$TRACK" --arg c "$code" --arg n "$NOTES" \
            '{track:$t, releases:[{versionCodes:[$c], status:"completed", releaseNotes:[{language:"en-US", text:$n}]}]}')
          curl -sS --fail-with-body "${auth[@]}" -X PUT -H "Content-Type: application/json" \
            -d "$body" "$api/edits/$edit/tracks/$TRACK" | jq -c .
          curl -sS --fail-with-body "${auth[@]}" -X POST "$api/edits/$edit:commit" | jq -c .
          echo "Uploaded versionCode $code to the $TRACK track." >> "$GITHUB_STEP_SUMMARY"

      - name: Replace the store screenshots on Google Play
        if: inputs.screenshots_run != ''
        env:
          TOKEN: ${{ steps.gauth.outputs.access_token }}
          LANG_CODE: en-US
        run: |
          set -euo pipefail
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE"
          up="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE"
          auth=(-H "Authorization: Bearer $TOKEN")
          edit=$(curl -sS --fail-with-body "${auth[@]}" -X POST "$api/edits" | jq -r .id)
          echo "Edit $edit: replacing $LANG_CODE phone screenshots"
          langs=$(curl -sS --fail-with-body "${auth[@]}" "$api/edits/$edit/listings" | jq -r '.listings[].language')
          echo "Store listing languages: $langs"
          echo "$langs" | grep -qx "$LANG_CODE" || { echo "No $LANG_CODE store listing; set LANG_CODE"; exit 1; }
          curl -sS --fail-with-body "${auth[@]}" -X DELETE \
            "$api/edits/$edit/listings/$LANG_CODE/phoneScreenshots" | jq -c '.deleted | length'
          for f in $(ls shots/*.png | sort); do
            curl -sS --fail-with-body "${auth[@]}" -X POST -H "Content-Type: image/png" \
              --data-binary @"$f" \
              "$up/edits/$edit/listings/$LANG_CODE/phoneScreenshots?uploadType=media" | jq -c '.image.id'
          done
          curl -sS --fail-with-body "${auth[@]}" -X POST "$api/edits/$edit:commit" | jq -c .
          echo "Replaced the Play phone screenshots with run ${{ inputs.screenshots_run }}'s framed screenshots." >> "$GITHUB_STEP_SUMMARY"
